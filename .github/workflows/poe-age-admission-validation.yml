name: Validate POE age-qualified discovery and build exact runtime
on:
  push:
    branches: [verify/poe-age-admission-source-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_SOURCE: 8913a9107989ce334b03e6167a2b4fc10d6fb7f6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SOURCE }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install the unchanged pinned dependencies
        run: |
          set -euo pipefail
          umask 077
          npm ci --include=dev
          mkdir -m 700 /tmp/poe-age-admission-validation
          git rev-parse HEAD > /tmp/poe-age-admission-validation/source-commit.txt
          git diff 24ed291d9da85f9661b3dec06d26d0a9332b97b5 -- src test scripts package.json package-lock.json > /tmp/poe-age-admission-validation/source.patch
      - name: Typecheck and compile
        run: |
          set -euo pipefail
          umask 077
          npm run build 2>&1 | tee /tmp/poe-age-admission-validation/typecheck.log
          npm run compile 2>&1 | tee /tmp/poe-age-admission-validation/compile.log
      - name: Complete application regression and reporting tests
        run: |
          set -euo pipefail
          umask 077
          node --import tsx --test --test-concurrency=1 test/*.test.ts 2>&1 | tee /tmp/poe-age-admission-validation/full.log
          node --test test/ai-team-dashboard.test.mjs test/reviewed-source-handover.test.mjs 2>&1 | tee /tmp/poe-age-admission-validation/reporting.log
      - name: Build and verify the exact PAPER runtime
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$TARGET_SOURCE"
          git status --porcelain > /tmp/poe-age-admission-validation/worktree-status.txt
          test ! -s /tmp/poe-age-admission-validation/worktree-status.txt
          node scripts/build-native-paper-ec2.mjs --output-directory /tmp/poe-native-paper-output-age-admission
          cp -a /tmp/poe-native-paper-output-age-admission /tmp/poe-age-admission-validation/bundle
          git archive HEAD src test scripts docs package.json package-lock.json tsconfig.json | gzip -n > /tmp/poe-age-admission-validation/source.tar.gz
          python3 -B -I - <<'PY'
          import hashlib,json,os,pathlib,re
          p=pathlib.Path('/tmp/poe-age-admission-validation');log=(p/'full.log').read_bytes();meta=json.loads((p/'bundle/metadata.json').read_bytes())
          def metric(key):
              rows=re.findall(r'(?m)^(?:# |ℹ )'+key+r'\s+(\d+)\s*$',log.decode())
              assert len(rows)==1,'COMPLETE_TEST_SUMMARY_REQUIRED:'+key
              return int(rows[0])
          count=metric('tests')
          assert count>=3577 and metric('pass')==count and all(metric(k)==0 for k in ('fail','skipped','cancelled'))
          source=os.environ['TARGET_SOURCE'];assert (p/'source-commit.txt').read_text().strip()==source
          assert meta['git']['commit']==source and meta['git']['workingTreeStatus']==''
          assert meta['financialMode']=='PAPER' and meta['liveTradingEnabled'] is False
          assert meta['smoke']['exitStatus']==0 and meta['smoke']['networkDisabled'] and meta['smoke']['readonlyPersistentBackup']
          receipt={'kind':'POE_AGE_ADMISSION_VALIDATED_BUILD','source':source,'base':'24ed291d9da85f9661b3dec06d26d0a9332b97b5','bundleSha256':hashlib.sha256((p/'bundle/native-paper.mjs').read_bytes()).hexdigest(),'testsPassed':count,'validationRun':int(os.environ['VALIDATION_RUN']),'buildRun':int(os.environ['VALIDATION_RUN']),'fullLogSha256':hashlib.sha256(log).hexdigest(),'financialWrites':0,'ec2Changed':False,'strategyChanged':False,'marketScope':'verified-pumpswap-actual-creation-age-at-most-24h','liveTradingEnabled':False}
          (p/'build-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: poe-age-admission-validation-${{ github.run_id }}
          path: /tmp/poe-age-admission-validation/
          retention-days: 14
          if-no-files-found: error
