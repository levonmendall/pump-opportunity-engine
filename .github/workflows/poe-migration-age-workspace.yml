name: Prepare isolated POE migration-age workspace
on:
  push:
    branches: [repair/poe-migration-age-1m-24h-20261103]
    paths: [.github/workflows/poe-migration-age-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
      - name: Install locked dependencies away from the trading host
        run: npm ci --include=dev
      - name: Export reproducible isolated test workspace without credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/poe-migration-workspace
          cp "$(command -v node)" /tmp/poe-migration-workspace/node
          tar -czf /tmp/poe-migration-workspace/dependencies.tar.gz node_modules
          git archive HEAD | gzip -n > /tmp/poe-migration-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/poe-migration-workspace/source-commit.txt
          sha256sum package-lock.json /tmp/poe-migration-workspace/node /tmp/poe-migration-workspace/dependencies.tar.gz > /tmp/poe-migration-workspace/checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poe-migration-age-workspace-${{ github.run_id }}
          path: /tmp/poe-migration-workspace/
          retention-days: 1
          if-no-files-found: error
