name: Validate and package POE operating reliability repairs
on:
  push:
    branches: [repair/poe-operating-reliability-20261104, repair/poe-operating-followthrough-20261104, repair/financial-feasible-peer, repair/backup-readiness-followthrough]
    # The exact runtime artifact precedes its reporting-only source handover.
    # The existing PR release gate still validates the later reporting commit.
    paths-ignore:
      - src/reviewed-source-handover.mjs
      - test/reviewed-source-handover.test.mjs
      - docs/**
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          check-latest: false
          cache: npm
      - name: Install immutable dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/poe-throughput-validation
          git rev-parse HEAD > /tmp/poe-throughput-validation/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/poe-throughput-validation/source-tree.txt
          git merge-base --is-ancestor 19b2aaa0b716a18758a473c7e9f5b7ebf99ca25b HEAD
          npm ci --include=dev 2>&1 | tee /tmp/poe-throughput-validation/dependencies.log
          test -z "$(git status --porcelain)"
      - name: Compile and run every application and reporting regression
        run: |
          set -euo pipefail
          umask 077
          npm run build 2>&1 | tee /tmp/poe-throughput-validation/typecheck.log
          npm run compile 2>&1 | tee /tmp/poe-throughput-validation/compile.log
          node --import tsx --test --test-concurrency=1 test/*.test.ts 2>&1 | tee /tmp/poe-throughput-validation/full.log
          node --test test/ai-team-dashboard.test.mjs test/reviewed-source-handover.test.mjs 2>&1 | tee /tmp/poe-throughput-validation/ai-reporting.log
          POE_FULL_PUBLICATION_BENCHMARK=1 node --import tsx --test test/native-paper-full-publication.test.ts 2>&1 | tee /tmp/poe-throughput-validation/full-publication-benchmark.log
          test -z "$(git status --porcelain)"
      - name: Build exact source and run isolated PAPER package smoke checks
        run: |
          set -euo pipefail
          umask 077
          node scripts/build-native-paper-ec2.mjs --output-directory /tmp/poe-native-paper-output-throughput 2>&1 | tee /tmp/poe-throughput-validation/package.log
          cp -a /tmp/poe-native-paper-output-throughput /tmp/poe-throughput-validation/bundle
          git archive HEAD src test scripts docs package.json package-lock.json tsconfig.json | gzip -n > /tmp/poe-throughput-validation/source.tar.gz
          node --import tsx --input-type=module -e "import {nativePaperConfigurationSha256} from './src/run-native-paper.ts'; console.log(nativePaperConfigurationSha256({service:true,stage:'two',deepSlots:4,strategy:'liquidity-resilient-momentum-v3.1'}))" > /tmp/poe-throughput-validation/configuration-sha256.txt
          python3 -B -I - <<'PY'
          import hashlib,json,os,pathlib,re
          p=pathlib.Path('/tmp/poe-throughput-validation')
          source=(p/'source-commit.txt').read_text().strip()
          assert source==os.environ['GITHUB_SHA']
          def metrics(name):
              text=(p/name).read_text()
              return {key:int(re.findall(r'(?m)^(?:# |ℹ )'+key+r'\s+(\d+)\s*$',text)[-1]) for key in ['tests','pass','fail','skipped','cancelled']}
          full,reporting=metrics('full.log'),metrics('ai-reporting.log')
          for result,minimum in [(full,3985),(reporting,108)]:
              assert result['tests']>=minimum and result['tests']==result['pass']
              assert result['fail']==result['skipped']==result['cancelled']==0
          meta=json.loads((p/'bundle/metadata.json').read_bytes())
          assert meta['git']['commit']==source and meta['git']['workingTreeStatus']==''
          assert meta['financialMode']=='PAPER' and meta['liveTradingEnabled'] is False
          assert meta['smoke']['exitStatus']==0 and meta['smoke']['networkDisabled']
          assert meta['smoke']['disposableFinancialFixture'] and meta['smoke']['readonlyPersistentBackup']
          digest=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          configuration=(p/'configuration-sha256.txt').read_text().strip()
          assert configuration=='f030f068a845d28f0717bf3edabe8bba0483f55cc3cc2f95a6feedb634c10d28'
          receipt={'kind':'POE_THROUGHPUT_VALIDATED_BUILD','source':source,'sourceTree':(p/'source-tree.txt').read_text().strip(),'base':'8334f5a56d01706cbdacc019bbc1fe76a136df24','bundleSha256':digest(p/'bundle/native-paper.mjs'),'configurationSha256':configuration,'testsPassed':full['pass'],'reportingTestsPassed':reporting['pass'],'validationRun':int(os.environ['GITHUB_RUN_ID']),'buildRun':int(os.environ['GITHUB_RUN_ID']),'fullLogSha256':digest(p/'full.log'),'reportingLogSha256':digest(p/'ai-reporting.log'),'financialControlWrites':0,'ec2Changed':False,'ageBasis':'verified-pumpswap-migration','minimumAgeMs':60000,'maximumAgeMs':86400000,'deepSlots':4,'strategy':'liquidity-resilient-momentum-v3.1','liveTrading':False}
          (p/'build-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: poe-throughput-validation-${{ github.run_id }}
          path: /tmp/poe-throughput-validation/
          retention-days: 14
          if-no-files-found: error
