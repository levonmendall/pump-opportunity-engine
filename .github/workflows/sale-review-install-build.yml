name: Sale review production validation and package
on:
  push:
    branches: [feature/four-hour-sale-review-install-20261101]
    paths: [.github/workflows/sale-review-install-build.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sale-review-install-build
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Verify and materialize reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat deploy/sale-review-payload/part{0,1,2,3}.b64 | base64 --decode | gzip -d > /tmp/sale-review.patch
          echo '9c41a317ecc34365edc53035fd9de00b2e6474bca2dbfbf814441af038fecaa4  /tmp/sale-review.patch' | sha256sum -c -
          git apply --check /tmp/sale-review.patch
          git apply /tmp/sale-review.patch
          rm -rf deploy/sale-review-payload
          rm .github/workflows/sale-review-install-build.yml
          mkdir -p validation
          node --version | tee validation/node-version.txt
      - name: Install pinned production and validation dependencies
        run: npm ci --include=dev
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee validation/typecheck.log
      - name: Focused sale-review tests including native SQLite and price adapter
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --import tsx --test --test-concurrency=1 test/sale-review*.test.ts 2>&1 | tee validation/sale-review-tests.log
      - name: Full existing regression suite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --import tsx --test --test-concurrency=1 test/*.test.ts 2>&1 | tee validation/full-tests.log
      - name: Compile production modules
        shell: bash
        run: |
          set -euo pipefail
          npm run compile 2>&1 | tee validation/compile.log
      - name: Publish validated source on separate delivery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'POE sale-review release builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test package.json deploy/sale-review-payload .github/workflows/sale-review-install-build.yml
          git commit -m 'Add persistent reporting-only four-hour PAPER sale reviews'
          DELIVERY="delivery/four-hour-sale-review-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$DELIVERY"
          git rev-parse HEAD > validation/source-commit.txt
          printf '%s\n' "$DELIVERY" > validation/delivery-branch.txt
      - name: Package isolated companion without changing trading bundle
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts
          mkdir -p companion-release
          cp -a dist node_modules package.json package-lock.json companion-release/
          cp validation/source-commit.txt companion-release/
          SOURCE_COMMIT=$(cat validation/source-commit.txt) node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("companion-release/receipt.json", JSON.stringify({kind:"POE_REPORTING_ONLY_SALE_REVIEW",schemaVersion:1,sourceCommit:process.env.SOURCE_COMMIT,nodeVersion:process.version,nodeModuleVersion:process.versions.modules,architecture:process.arch,platform:process.platform,productionTypecheckPassed:true,focusedTestsPassed:true,fullRegressionPassed:true,compiled:true,changesTradingEngine:false,changesFinancialLedger:false,fundedExecution:false,accountId:"poe-3123e352-4581-455b-85db-acd7e825e99e",inceptionAt:"2026-10-26T22:07:36.212Z",horizonMs:14400000,checkpointGraceMs:30000})+"\n")'
          cp -a validation companion-release/
          tar -czf poe-sale-review-companion.tgz -C companion-release .
          sha256sum poe-sale-review-companion.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish download pinned to validated build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="sale-review-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" poe-sale-review-companion.tgz SHA256SUMS --target "$(cat validation/source-commit.txt)" --title 'Four-hour PAPER sale review — isolated companion' --prerelease --notes 'Validated production build. Reporting-only companion; does not deploy or replace the EC2 trading engine. Install only with the separately reviewed original-account installer. Dashboard source is on the delivery branch recorded in the package.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sale-review-production-validation
          path: validation/
          if-no-files-found: warn
