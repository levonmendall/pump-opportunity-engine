name: Build reviewed POE capture stability release
on:
  push:
    branches: [repair/poe-capture-stability-20261101]
    paths: ['.github/workflows/poe-capture-stability-reviewed-build.yml']
permissions:
  contents: read
concurrency:
  group: poe-capture-stability-20261101
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7aec04077bf560fa95078f2d811195ccc0ee13ed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install unchanged dependencies and retain prior test attribution
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/poe-capture-reviewed
          npm ci --include=dev
          git rev-parse HEAD > /tmp/poe-capture-reviewed/source-commit.txt
          git diff 31efee2c44725722e7948165126e6296111f165c -- src test docs > /tmp/poe-capture-reviewed/source.patch
          printf '%s\n' '{"priorRuns":[41272314981,41272507272],"firstFocusedTests":459,"firstPassed":457,"firstFailed":2,"failures":["real-receiver fixture used CommonJS Receiver property on ESM default WebSocket","pinned @types/ws omits the named ESM Receiver declaration"],"correction":"fixture loads actual pinned Receiver using createRequire; runtime code and assertions unchanged","runtimeSourceChangedForCorrection":false,"assertionsRelaxed":false,"testsSkipped":false}' > /tmp/poe-capture-reviewed/prior-validation.json
      - name: Typecheck and compile
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/poe-capture-reviewed/typecheck.log
          npm run compile 2>&1 | tee /tmp/poe-capture-reviewed/compile.log
          node -e "const D=require('better-sqlite3');const d=new D(':memory:');console.log(JSON.stringify({node:process.version,sqlite:d.prepare('select sqlite_version() version').get().version,ws:require('ws/package.json').version}));d.close()" > /tmp/poe-capture-reviewed/toolchain.json
      - name: Focused capture, retirement, age and financial safety regressions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --import tsx --test --test-concurrency=1 test/ws-frame-receipt-clock.test.ts test/native-evidence-classification.test.ts test/pilot-native-flow.test.ts test/native-flow-service-policy.test.ts test/native-candidate-runner.test.ts test/native-managed-cancel-settlement.test.ts test/native-settled-recovery.test.ts test/native-startup-integration.test.ts test/operating-intelligence.test.ts test/native-paper-service.test.ts test/token-age-policy.test.ts test/execution.test.ts test/native-control-recovery.test.ts test/native-paper-readiness.test.ts 2>&1 | tee /tmp/poe-capture-reviewed/focused.log
      - name: Full offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --import tsx --test --test-concurrency=1 test/*.test.ts 2>&1 | tee /tmp/poe-capture-reviewed/full.log
      - name: Build exact clean immutable PAPER executable
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = 7aec04077bf560fa95078f2d811195ccc0ee13ed
          test -z "$(git status --porcelain -- src scripts package.json package-lock.json)"
          node scripts/build-native-paper-ec2.mjs --output-directory /tmp/poe-native-paper-output-capture-reviewed
          cp -a /tmp/poe-native-paper-output-capture-reviewed /tmp/poe-capture-reviewed/bundle
          python3 -B -I - <<'PY'
          import hashlib,json,pathlib,re
          p=pathlib.Path('/tmp/poe-capture-reviewed');source=(p/'source-commit.txt').read_text().strip();meta=json.loads((p/'bundle/metadata.json').read_bytes())
          assert meta['git']['commit']==source and meta['git']['workingTreeStatus']==''
          log=(p/'full.log').read_text()
          def metric(k):
              rows=re.findall(r'(?m)^(?:# |ℹ )'+k+r'\s+(\d+)\s*$',log);assert len(rows)==1;return int(rows[0])
          count=metric('tests');assert count>=3063 and metric('pass')==count and all(metric(k)==0 for k in ['fail','skipped','cancelled'])
          receipt={'kind':'POE_CAPTURE_STABILITY_VALIDATED_BUILD','source':source,'base':'31efee2c44725722e7948165126e6296111f165c','bundleSha256':hashlib.sha256((p/'bundle/native-paper.mjs').read_bytes()).hexdigest(),'testsPassed':count,'receiptPolicy':'ws-frame-first-byte-receipt-v1','receiptFreshnessMs':5000,'handlerProcessingLimitUnchanged':True,'persistentIdleGraceMs':15000,'gapInvalidationImmediate':True,'financialClassificationPreserved':True,'tokenAgeMaximumMs':86400000,'missingEvidenceWaitBonus':0,'fourSlotsPreserved':True,'liveTradingEnabled':False,'ec2Changed':False,'ownerReleaseApprovalRequired':True,'priorNonpassingRuns':[41272314981,41272507272]}
          (p/'build-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
          sha256sum /tmp/poe-capture-reviewed/bundle/* > /tmp/poe-capture-reviewed/SHA256SUMS
      - name: Retain source changes, all validation results and executable when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poe-capture-stability-reviewed-${{ github.run_id }}
          path: /tmp/poe-capture-reviewed/
          retention-days: 30
          if-no-files-found: error
