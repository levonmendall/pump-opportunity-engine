name: POE dashboard validation
on:
  pull_request:
    paths:
      - 'src/dashboard.ts'
      - 'src/dashboard-connectivity.ts'
      - 'src/dashboard-connections.ts'
      - 'src/pilot-telemetry.ts'
      - 'scripts/publish-pilot-status.mjs'
      - 'test/pilot-telemetry.test.mjs'
      - 'test/pilot-publisher.test.mjs'
      - 'test/dashboard-pilot-ui.test.ts'
      - 'test/dashboard-pilot-integration.test.ts'
      - 'src/reporting.ts'
      - 'src/lifetime-equity-contract.ts'
      - 'src/lifetime-equity-store.ts'
      - 'src/lifetime-equity-publisher.ts'
      - 'test/lifetime-equity.test.ts'
      - 'test/dashboard-equity-line.test.ts'
      - 'test/reporting.test.ts'
      - 'package*.json'
      - '.github/workflows/dashboard-validation.yml'
  workflow_dispatch:
concurrency:
  group: poe-dashboard-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run build
      - name: Offline regressions
        run: |
          umask 077
          npm test

      - name: Pilot reporting regressions
        run: npm run test:pilot-reporting
