name: POE dashboard validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/dashboard-validation.yml'
  workflow_dispatch:
concurrency:
  group: poe-dashboard-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline provenance checks compare against approved historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run build
      - name: Offline regressions
        run: |
          umask 077
          npm test
