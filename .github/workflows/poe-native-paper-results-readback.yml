name: POE bounded isolated PAPER projection readback
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare one settled-run allowlist archive, or read a bounded chunk
        required: true
        type: choice
        options: [prepare, readback]
      source_run_id:
        description: Completed bounded PAPER supervision GitHub run ID
        required: true
        type: string
      source_attempt:
        description: Completed bounded PAPER supervision attempt
        required: true
        default: '1'
        type: string
      offset:
        description: Compressed archive byte offset; unused for prepare
        required: true
        default: '0'
        type: string
      length:
        description: Compressed bytes to read (1 through4194304); unused for prepare
        required: true
        default: '4194304'
        type: string
permissions:
  contents: read
concurrency:
  group: meme-machine-ec2-administration
  cancel-in-progress: false
jobs:
  paper-result-readback:
    if: github.repository == 'levonmendall/meme-machine-admin' && github.ref == 'refs/heads/main'
    runs-on: meme-machine-ec2-admin
    timeout-minutes: 3
    steps:
      - name: Read only the fixed reviewed projection and existing chunk helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            operator/native-paper-ec2/readback-results.py
            operator/native-candidate-ec2/readback-public-evidence.py
      - name: Verify fixed helpers and prepare or read one bounded projection archive
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
          READBACK_PHASE: ${{ inputs.phase }}
          READBACK_RUN_ID: ${{ inputs.source_run_id }}
          READBACK_ATTEMPT: ${{ inputs.source_attempt }}
          READBACK_OFFSET: ${{ inputs.offset }}
          READBACK_LENGTH: ${{ inputs.length }}
          READBACK_HELPER_SHA256: __REVIEWED_PAPER_RESULT_READBACK_SHA256__
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER" = meme-machine-ec2-admin
          test "$(id -u)" = 994
          python3 -B -I - "$READBACK_HELPER_SHA256" <<'PYHASH'
          import hashlib,os,stat,sys
          for p,expected in [('operator/native-paper-ec2/readback-results.py',sys.argv[1]),('operator/native-candidate-ec2/readback-public-evidence.py','81f017b3a2fa789ec6f3f75f1718c9036067bf9690a0d1f7cf05852c9484501a')]:
              fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  s=os.fstat(fd)
                  assert stat.S_ISREG(s.st_mode) and s.st_uid==994 and s.st_nlink==1 and 0<s.st_size<=65536 and not s.st_mode&0o022
                  body=os.read(fd,s.st_size+1)
                  assert len(body)==s.st_size and len(expected)==64 and hashlib.sha256(body).hexdigest()==expected
              finally: os.close(fd)
          PYHASH
          # This read-only post-settlement task cannot overlap the exclusive
          # administration workflow or acquire a financial writer's owner lease.
          /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=3s 90s \
            /usr/bin/nice -n 19 /usr/bin/prlimit \
            --cpu=60:60 --as=268435456:268435456 --nofile=64:64 \
            --fsize=41943040:41943040 --core=0:0 -- \
            /usr/bin/python3 -B -I operator/native-paper-ec2/readback-results.py \
            --phase "$READBACK_PHASE" --run-id "$READBACK_RUN_ID" \
            --attempt "$READBACK_ATTEMPT" --offset "$READBACK_OFFSET" --length "$READBACK_LENGTH"
