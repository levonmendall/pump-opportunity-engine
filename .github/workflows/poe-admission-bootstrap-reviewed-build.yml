name: Revalidate exact POE admission repair in private-file test environment
on:
  push:
    branches: [repair/poe-admission-bootstrap-20261101]
    paths: ['.github/workflows/poe-admission-bootstrap-reviewed-build.yml']
permissions:
  contents: read
concurrency:
  group: poe-admission-bootstrap-20261101
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bb145cc82b0f05560b03bbd9e53de0c9e360f48f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install unchanged dependencies and preserve prior validation evidence
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/poe-admission-reviewed
          npm ci --include=dev
          git rev-parse HEAD > /tmp/poe-admission-reviewed/source-commit.txt
          git diff 0044b552ef160bf43823d16578c63431b0bcfd9d -- src test docs > /tmp/poe-admission-reviewed/source.patch
          printf '%s\n' '{"priorRun":41333371895,"source":"bb145cc82b0f05560b03bbd9e53de0c9e360f48f","focusedPassed":274,"fullTests":3080,"fullPassed":3052,"fullFailed":28,"failure":"private bounded regular backup/source file required","priorFullTestStepMissingUmask077":true,"sourceChanged":false,"assertionsRelaxed":false,"testsSkipped":false}' > /tmp/poe-admission-reviewed/prior-validation.json
      - name: Typecheck and compile unchanged source
        run: |
          set -euo pipefail
          umask 077
          npm run build 2>&1 | tee /tmp/poe-admission-reviewed/typecheck.log
          npm run compile 2>&1 | tee /tmp/poe-admission-reviewed/compile.log
      - name: Recheck backup permissions with unchanged backup assertions
        run: |
          set -euo pipefail
          umask 077
          test "$(umask)" = 0077
          node --import tsx --test --test-concurrency=1 test/backup.test.ts test/native-paper-backup-admission.test.ts 2>&1 | tee /tmp/poe-admission-reviewed/backup-recheck.log
      - name: Full offline regression suite with private-file umask and no exclusions
        run: |
          set -euo pipefail
          umask 077
          test "$(umask)" = 0077
          node --import tsx --test --test-concurrency=1 test/*.test.ts 2>&1 | tee /tmp/poe-admission-reviewed/full.log
      - name: Build exact clean PAPER executable after complete success
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = bb145cc82b0f05560b03bbd9e53de0c9e360f48f
          test -z "$(git status --porcelain -- src scripts package.json package-lock.json)"
          node scripts/build-native-paper-ec2.mjs --output-directory /tmp/poe-native-paper-output-admission-reviewed
          cp -a /tmp/poe-native-paper-output-admission-reviewed /tmp/poe-admission-reviewed/bundle
          git archive HEAD src test scripts docs package.json package-lock.json tsconfig.json | gzip -n > /tmp/poe-admission-reviewed/source.tar.gz
          python3 -B -I - <<'PY'
          import hashlib,json,pathlib,re
          p=pathlib.Path('/tmp/poe-admission-reviewed');source=(p/'source-commit.txt').read_text().strip();meta=json.loads((p/'bundle/metadata.json').read_bytes());log=(p/'full.log').read_text()
          def metric(k):
              rows=re.findall(r'(?m)^(?:# |ℹ )'+k+r'\s+(\d+)\s*$',log);assert len(rows)==1;return int(rows[0])
          count=metric('tests');assert count==3080 and metric('pass')==count and all(metric(k)==0 for k in ['fail','skipped','cancelled'])
          assert meta['git']['commit']==source and meta['git']['workingTreeStatus']=='' and meta['financialMode']=='PAPER' and meta['liveTradingEnabled'] is False
          receipt={'kind':'POE_ADMISSION_BOOTSTRAP_VALIDATED_BUILD','source':source,'base':'0044b552ef160bf43823d16578c63431b0bcfd9d','bundleSha256':hashlib.sha256((p/'bundle/native-paper.mjs').read_bytes()).hexdigest(),'testsPassed':count,'baselineReproductionRun':41333110701,'baselineDefectsReproduced':3,'priorNonpassingRun':41333371895,'unchangedSourceRetested':True,'financialControlWrites':0,'readinessRulesChanged':False,'auditDeadlinesChanged':False,'tokenAgeMaximumMs':86400000,'deepSlots':4,'liveTradingEnabled':False,'ec2Changed':False,'ownerReleaseApprovalRequired':True}
          (p/'build-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt))
          PY
          sha256sum /tmp/poe-admission-reviewed/bundle/* > /tmp/poe-admission-reviewed/SHA256SUMS
      - name: Retain complete reviewed validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poe-admission-reviewed-${{ github.run_id }}
          path: /tmp/poe-admission-reviewed/
          retention-days: 30
          if-no-files-found: error
