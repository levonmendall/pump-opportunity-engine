name: POE read-only persistent startup capability
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-machine-ec2-administration
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'levonmendall/meme-machine-admin' && github.ref == 'refs/heads/main'
    runs-on: meme-machine-ec2-admin
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            operator/native-paper-ec2/service-capability.py
      - name: Verify and inspect fixed nonroot startup metadata only
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
          EXPECTED_CAPABILITY_SHA256: b6552433ba318d335032a95b3fd01549ba8ea98804f2a8d8e0491c46fd16fb8e
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER" = meme-machine-ec2-admin
          test "$(id -u)" = 994
          python3 -B -I - "$EXPECTED_CAPABILITY_SHA256" <<'PYHASH'
          import hashlib,os,stat,sys
          fd=os.open('operator/native-paper-ec2/service-capability.py',os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              s=os.fstat(fd)
              assert stat.S_ISREG(s.st_mode) and s.st_uid==994 and s.st_nlink==1 and 0<s.st_size<=16384 and not s.st_mode&0o022
              b=os.read(fd,s.st_size+1)
              assert len(b)==s.st_size and hashlib.sha256(b).hexdigest()==sys.argv[1]
          finally:os.close(fd)
          PYHASH
          /usr/bin/env -i PATH=/usr/bin:/bin ACTUAL_RUNNER="$ACTUAL_RUNNER" \
            /usr/bin/timeout --signal=TERM --kill-after=2s 35s \
            /usr/bin/prlimit --cpu=3:4 --nofile=32:32 --fsize=32768:32768 --core=0:0 -- \
            /usr/bin/python3 -B -I operator/native-paper-ec2/service-capability.py
