name: POE original active AdaptiveMomentumV2 staging only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-machine-ec2-administration
  cancel-in-progress: false
jobs:
  stage-verified-continuation:
    if: github.repository == 'levonmendall/meme-machine-admin' && github.ref == 'refs/heads/main'
    runs-on: meme-machine-ec2-admin
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: operator/native-paper-ec2/adaptive-v2-upgrade-package/
      - name: Stage reviewed original-service package without stopping the service
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER" = meme-machine-ec2-admin
          test "$(id -u)" = 994
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C ACTUAL_RUNNER="$ACTUAL_RUNNER" \
            /usr/bin/timeout --signal=TERM --kill-after=3s 30s \
            /usr/bin/nice -n 19 /usr/bin/prlimit \
            --cpu=5:5 --as=134217728:134217728 --nofile=64:64 --fsize=8388608:8388608 --core=0:0 -- \
            /usr/bin/python3 -B -I - <<'PYSTAGE'
          import gzip,hashlib,io,json,os,pathlib,pwd,stat,subprocess,time,types
          assert os.getuid()==994 and pwd.getpwuid(994).pw_name=='mm-ec2-runner' and os.environ['ACTUAL_RUNNER']=='meme-machine-ec2-admin'
          transport_sha='b52f1f29847f4f87e92479ad8e099ba88213102a9a6ee2cede170c9d3a189ff1'
          index_sha='bfa036228776da29de43ad110b9f7a07827d8ced815fa1e43b2bb9b20e072b8a'
          driver_sha='65a2f6dd65836a8e644d90e18acdcce2966a5feb3afd5c721c2725b9c20ee891'
          limits={'native-paper.mjs':8388608,'backup-worker.mjs':1048576,'better_sqlite3.node':4194304,'metadata.json':1048576,'snapshot-publisher.mjs':1048576,'run-authoritative-service.py':131072,'forward-original-upgrade.py':131072,'service.json':131072,'index.json':131072,'poe-runtime-persistent.conf':8192}
          def digest(b):return hashlib.sha256(b).hexdigest()
          def read(p,maximum):
              assert p.parent.resolve(strict=True)==p.parent
              f=os.open(p,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  s=os.fstat(f);assert stat.S_ISREG(s.st_mode)and s.st_uid==994 and s.st_nlink==1 and not s.st_mode&0o022 and 0<s.st_size<=maximum
                  b=os.read(f,s.st_size+1);a=os.fstat(f);assert len(b)==s.st_size and(s.st_size,s.st_mtime_ns,s.st_ctime_ns)==(a.st_size,a.st_mtime_ns,a.st_ctime_ns);return b
              finally:os.close(f)
          def view():
              r=subprocess.run(['/usr/bin/systemctl','show','poe-runtime.service','--property=MainPID,NRestarts,User,LoadState,ActiveState,SubState'],capture_output=True,text=True,timeout=5,check=True,env={'PATH':'/usr/bin:/bin','LANG':'C'});assert len(r.stdout)<=4096
              v=dict(l.split('=',1)for l in r.stdout.splitlines()if'='in l);assert v.get('User')=='poe-runtime'and v.get('LoadState')=='loaded'and v.get('ActiveState')=='active'and v.get('SubState')=='running'and int(v.get('MainPID','0'))>0;return v
          before=view();source=pathlib.Path('operator/native-paper-ec2/adaptive-v2-upgrade-package').resolve(strict=True);raw=read(source/'transport.json',131072);assert digest(raw)==transport_sha;t=json.loads(raw)
          assert set(t)=={'schemaVersion','kind','indexSha256','driverSha256','source','files'}and t['schemaVersion']==1 and t['kind']=='poe-original-forward-transport-v1'and t['indexSha256']==index_sha and t['driverSha256']==driver_sha
          assert len(t['files'])==len(limits)and{r['file']for r in t['files']}==set(limits);data={};total_packed=0
          for r in t['files']:
              n=r['file'];assert set(r)=={'file','bytes','sha256','packedFile','packedBytes','packedSha256'}and r['packedFile']==n+'.gz'and type(r['bytes'])is int and 0<r['bytes']<=limits[n]and type(r['packedBytes'])is int and 0<r['packedBytes']<=8388608
              packed=read(source/r['packedFile'],8388608);assert len(packed)==r['packedBytes']and digest(packed)==r['packedSha256'];total_packed+=len(packed);assert total_packed<=8388608
              with gzip.GzipFile(fileobj=io.BytesIO(packed))as g:body=g.read(r['bytes']+1)
              assert len(body)==r['bytes']and digest(body)==r['sha256'];data[n]=body
          assert digest(data['index.json'])==index_sha and digest(data['forward-original-upgrade.py'])==driver_sha
          folder=pathlib.Path('/var/tmp/poe-original-adaptive-v2-upgrade');space=os.statvfs(folder.parent);assert space.f_bavail*space.f_frsize>=536870912+sum(map(len,data.values()))
          preserved_partial=None
          if not os.path.lexists(folder):folder.mkdir(mode=0o700)
          s=folder.lstat();assert stat.S_ISDIR(s.st_mode)and s.st_uid==994 and stat.S_IMODE(s.st_mode)==0o700 and folder.resolve(strict=True)==folder and set(p.name for p in folder.iterdir())<=set(limits)
          for n,body in data.items():
              p=folder/n
              if os.path.lexists(p):assert read(p,limits[n])==body
              else:
                  pending=folder/('.'+n+'.pending');f=os.open(pending,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
                  try:
                      pos=0
                      while pos<len(body):pos+=os.write(f,body[pos:])
                      os.fsync(f)
                  finally:os.close(f)
                  assert read(pending,limits[n])==body;os.rename(pending,p)
              assert read(p,limits[n])==body
          f=os.open(folder,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW);os.fsync(f);os.close(f)
          # Validate the EXACT proposed driver's strict unit parser on the actual host.
          # Import names are inert; no main/root operation, market request or DB open.
          def module(name,body,file):
              m=types.ModuleType(name);m.__file__=str(file);exec(compile(body,str(file),'exec'),m.__dict__);return m
          sup=module('poe_nonroot_staging_supervisor',data['run-authoritative-service.py'],folder/'run-authoritative-service.py');driver=module('poe_nonroot_staging_forward_driver',data['forward-original-upgrade.py'],folder/'forward-original-upgrade.py');actual_unit=driver.unit();package=driver.bundle(folder,994,index_sha,driver_sha,sup);owner=pwd.getpwnam('poe-runtime');assert(owner.pw_uid,owner.pw_gid)==(driver.UID,driver.GID)==(988,982)
          after=view();assert before==after
          print(json.dumps({'kind':'POE_ORIGINAL_FORWARD_UPGRADE_STAGED_NOT_INSTALLED','at':int(time.time()*1000),'directory':str(folder),'source':t['source'],'indexSha256':index_sha,'driverSha256':driver_sha,'transportSha256':transport_sha,'files':[{'file':n,'bytes':len(b),'sha256':digest(b)}for n,b in data.items()],'exactStagedUnitParserVerified':True,'actualUnit':actual_unit,'runtimeIdentity':{'uid':owner.pw_uid,'gid':owner.pw_gid},'serviceBefore':before,'serviceAfter':after,'sameSupervisor':True,'preservedPriorPartial':preserved_partial,'providerRequests':0,'financialDatabaseOpened':False,'credentialsRead':False,'serviceControlOperations':0,'executed':False},separators=(',',':')),flush=True)
          PYSTAGE
